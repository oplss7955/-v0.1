<main><section class="title" id="title"><div class="eyebrow">AN INTERACTIVE SHORT STORY</div><h1>비가 그친<br>뒤에도</h1><p>마지막 방송까지, 남은 시간은 하루.<br>네가 기다려 준 만큼, 나는 말할 수 있었다.</p><div class="titlemenu"><button class="primary" onclick="startNew()">이야기 시작 <span aria-hidden="true">↗</span></button><button onclick="continueGame()">이어하기</button><button onclick="openGallery()">엔딩 노트</button></div><div class="small">한서윤 루트 · 세 가지 엔딩 · 이름 없는 주인공<br>음악·빗소리는 오른쪽 위에서 켤 수 있어.<br>짧은 창작 연애 비주얼 노벨 / v1.0</div></section>

<script>
const STORY={"start": {"title": "01 / 남겨진 주파수", "lines": [{"who": "", "text": "비가 오면, 학교는 평소보다 일찍 비어 버린다."}, {"who": "", "text": "청소 당번을 마치고 나오던 나는 4층에서 내 이름을 들었다."}, {"who": "스피커", "text": "……다음 곡은, 오늘도 대답을 미룬 사람에게."}, {"who": "나", "text": "방송, 아직 안 끝났나?"}, {"who": "", "text": "방송실 문에는 A4 용지 한 장이 붙어 있었다. 「방송부 장비 정리: 금요일까지」."}, {"who": "", "text": "그 아래, 누군가 연필로 작게 써 놓았다. ‘목요일 방송은 합니다.’"}, {"who": "", "text": "문을 두드리려던 순간, 안쪽에서 종이가 쏟아지는 소리가 났다."}, {"who": "서윤", "text": "들어와도 돼. 선생님이면…… 잠깐만 기다려 주시고."}, {"who": "나", "text": "선생님은 아닌데."}, {"who": "", "text": "책상에 쪼그려 앉아 있던 아이가 고개를 들었다. 같은 반 한서윤이었다."}, {"who": "서윤", "text": "아. 너구나. 그럼 더 기다려 줘."}, {"who": "", "text": "바닥에는 신청곡 쪽지와 케이블이 뒤섞여 있었다. 창가의 빨간 ON AIR 등만 꺼지지 않았다."}, {"who": "나", "text": "방송부, 정말 없어져?"}, {"who": "서윤", "text": "응. 인원 부족. 점심 방송은 다음 달부터 자동 재생이래."}, {"who": "", "text": "서윤은 ‘자동’이라는 단어를 별다른 힘 없이 말했다."}, {"who": "서윤", "text": "지금 들은 건 연습이야. 실수로 복도 스피커까지 켰어."}, {"who": "", "text": "나는 발치로 미끄러진 쪽지를 주웠다. ‘신청자: 익명 / 사연: 아직 못 썼어요.’"}], "next": null, "choices": [{"text": "쪽지를 함께 주워 준다.", "to": "help", "effects": {"trust": 1}}, {"text": "방금 한 멘트가 좋았다고 말한다.", "to": "voice", "effects": {"voice": 1}}]}, "help": {"title": "01 / 남겨진 주파수", "lines": [{"who": "나", "text": "이건 어디에 놓으면 돼?"}, {"who": "서윤", "text": "날짜 있는 건 왼쪽. 없는 건…… 그냥 오른쪽."}, {"who": "", "text": "날짜 없는 쪽지가 훨씬 많았다."}, {"who": "나", "text": "분류 기준, 조금 슬프다."}, {"who": "서윤", "text": "버릴 기준보다는 낫지."}, {"who": "", "text": "서윤이 내 손에서 쪽지를 받아 가지 않았다. 대신 내 옆에 작은 상자를 밀어 주었다."}, {"who": "서윤", "text": "고마워. 혼자 하면 자꾸 읽게 돼서."}], "next": "invite", "choices": null}, "voice": {"title": "01 / 남겨진 주파수", "lines": [{"who": "나", "text": "아까, 대답을 미룬 사람에게라는 말. 좋았어."}, {"who": "서윤", "text": "다 들렸구나."}, {"who": "나", "text": "누구한테 하는 말이었어?"}, {"who": "", "text": "서윤은 대답 대신 마이크의 스위치를 내렸다."}, {"who": "서윤", "text": "아직은, 원고한테."}, {"who": "", "text": "나는 더 묻지 않고 쪽지를 한 장 집었다. 종이 귀퉁이가 손때로 반들거렸다."}, {"who": "서윤", "text": "좋았다고 해 줘서 고마워. 조금 민망하긴 한데."}], "next": "invite", "choices": null}, let state=null,typing=null,full='',shown=0,auto=false,autoTimer=null,lastFocus=null;
let preferences={speed:28},sound=false,audio=null,master=null,rainSource=null,musicTimer=null,noteIndex=0;
let store={slots:[null,null,null],auto:null,unlocked:[]};
try{let v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.slots))store={...store,...v};}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(store));return true}catch(e){return false}}
function clone(o){return JSON.parse(JSON.stringify(o))}
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.add('hidden'),2500)}
function modal(html){lastFocus=document.activeElement;stopAuto();$('panel').innerHTML=html;$('overlay').classList.remove('hidden');let f=$('panel').querySelector('button,input');if(f)f.focus()}
function closeOverlay(){$('overlay').classList.add('hidden');if(lastFocus&&lastFocus.isConnected)lastFocus.focus()}
function endRoute(s){let v=s.values;return v.trust>=3&&v.care>=2&&v.pressure===0?'truebroadcast':v.voice>=3?'normalbroadcast':'quietbroadcast'}
function fresh(){return {node:'start',index:0,values:{trust:0,voice:0,care:0,pressure:0},log:[],trail:[],saved:Date.now()}}
function startNew(){if(state&&!$('title').classList.contains('hidden')){modal('<h2>처음부터 시작할까?</h2><p>현재 진행은 자동 저장에 남아 있어. 새로 시작하면 자동 저장은 덮어써져. 수동 저장은 유지돼.</p><button class="primary" onclick="newConfirmed()">새 이야기 시작</button><button onclick="closeOverlay()">돌아가기</button>');return}newConfirmed()}
function newConfirmed(){closeOverlay();stopAuto();state=fresh();enter('start')}
function continueGame(){if(store.auto)loadState(store.auto);else toast('아직 저장된 이야기가 없어. 먼저 이야기를 시작해 줘.')}
function validState(s){return s&&STORY[s.node]&&Number.isInteger(s.index)&&s.index>=0&&s.index<=STORY[s.node].lines.length&&s.values&&['trust','voice','care','pressure'].every(k=>Number.isFinite(s.values[k]))&&Array.isArray(s.log)&&Array.isArray(s.trail)}
function loadState(s){if(!validState(s)){toast('올바른 저장 데이터가 아니야.');return}stopAuto();state=clone(s);closeOverlay();$('title').classList.add('hidden');$('ending').classList.add('hidden');render()}
function autosave(){if(!state)return;state.saved=Date.now();store.auto=clone(state);persist()}
function enter(id){if(id==='resolve')id=endRoute(state);state.node=id;state.index=0;state.trail.push(id);$('title').classList.add('hidden');$('ending').classList.add('hidden');render();autosave()}
function clearTyping(){if(typing)clearInterval(typing);typing=null}
function render(){clearTyping();clearTimeout(autoTimer);let n=STORY[state.node];$('chapter').textContent=n.title;$('chapter').classList.remove('hidden');$('choices').classList.add('hidden');$('dialog').classList.remove('hidden');if(state.index>=n.lines.length){finishScene();return}let l=n.lines[state.index];$('speaker').textContent=l.who||' ';full=l.text;shown=0;$('words').textContent='';$('status').textContent=(auto?'AUTO ON · ':'')+'SPACE / ENTER · 다음';$('bg').style.filter=l.who?'brightness(.9)':'brightness(.72) saturate(.85)';if(!preferences.speed){$('words').textContent=full;shown=full.length;queueAuto()}else{typing=setInterval(()=>{shown++;$('words').textContent=full.slice(0,shown);if(shown>=full.length){clearTyping();queueAuto()}},preferences.speed)}}
function logCurrent(){let n=STORY[state.node];if(state.index<n.lines.length){let l=n.lines[state.index];state.log.push({who:l.who,text:l.text});if(state.log.length>600)state.log.shift()}}
function advance(){if(!state||!$('overlay').classList.contains('hidden')||!$('choices').classList.contains('hidden')||!$('ending').classList.contains('hidden')||!$('title').classList.contains('hidden'))return;if(shown<full.length){clearTyping();shown=full.length;$('words').textContent=full;queueAuto();return}clearTimeout(autoTimer);logCurrent();state.index++;render();autosave()}
function finishScene(){let n=STORY[state.node];clearTyping();if(n.choices){stopAuto();$('choices').replaceChildren();n.choices.forEach((c,i)=>{let b=document.createElement('button');let num=document.createElement('span');num.textContent=String(i+1).padStart(2,'0');b.append(num,document.createTextNode(c.text));b.onclick=()=>choose(i);$('choices').appendChild(b)});$('choices').classList.remove('hidden');$('dialog').classList.add('hidden');$('choices').querySelector('button').focus()}else if(n.next){enter(n.next)}else{showEnding()}}
function choose(i){let c=STORY[state.node].choices?.[i];if(!c)return;state.log.push({who:'나의 선택',text:c.text});for(let [k,v]of Object.entries(c.effects))state.values[k]=(state.values[k]||0)+v;enter(c.to)}
function queueAuto(){if(auto){clearTimeout(autoTimer);autoTimer=setTimeout(advance,Math.max(1800,full.length*65))}}
function stopAuto(){auto=false;clearTimeout(autoTimer)}
function toggleAuto(){if(!state)return;auto=!auto;if(auto)queueAuto();else clearTimeout(autoTimer);toast(auto?'자동 진행 ON · 선택지에서 멈춰.':'자동 진행 OFF');$('status').textContent=(auto?'AUTO ON · ':'')+'SPACE / ENTER · 다음'}
const endInfo={endtrue:['01','비가 그친 뒤에도','자신의 속도로 말할 수 있었던 서윤. 방송이 끝난 뒤, 두 사람은 핑계 없는 다음 만남을 약속했다.'],endfriend:['02','다음 주파수','서윤은 자신의 목소리를 가지고 다음으로 나아갔다. 두 사람의 관계에는 아직 이름 대신 가능성이 남아 있다.'],endquiet:['03','읽지 않은 편지','마지막 방송은 끝났지만 모든 마음이 전해지지는 않았다. 가까워지려면 용기뿐 아니라 기다릴 자리도 필요했다.']};
function showEnding(){stopAuto();let id=state.node;if(!store.unlocked.includes(id))store.unlocked.push(id);autosave();let e=endInfo[id];$('dialog').classList.add('hidden');$('choices').classList.add('hidden');$('ending').classList.remove('hidden');$('ending').innerHTML='<div class="eyebrow">ENDING '+e[0]+' / 03</div><h2>'+e[1]+'</h2><p>'+e[2]+'</p><div class="small">글 · 그림 · 인터랙션으로 구성한 창작 단편<br>함께 마지막 방송을 들어 줘서 고마워.</div><div class="endbuttons"><button class="primary" onclick="openGallery()">엔딩 노트</button><button onclick="openSaves()">저장 / 불러오기</button><button onclick="goTitle()">타이틀로</button></div>'}
function goTitle(){closeOverlay();stopAuto();clearTyping();['dialog','chapter','choices','ending'].forEach(id=>$(id).classList.add('hidden'));$('title').classList.remove('hidden');$('bg').style.filter=''}
function date(s){return new Date(s.saved).toLocaleString('ko-KR')}
function openSaves(){let h='<h2>이야기 보관함</h2><p>자동 저장은 매 대사와 선택 뒤 갱신돼. 수동 저장은 세 칸이야. 같은 브라우저·파일 위치에서 유지되며, 차단된 환경에서는 내보내기를 이용해 줘.</p>';if(store.auto)h+='<button class="slot" onclick="continueGame()">자동 저장 · '+STORY[store.auto.node]?.title+'<small>'+date(store.auto)+'</small></button>';store.slots.forEach((s,i)=>{h+='<div style="border-top:1px solid #ffffff20;padding:12px 0"><div class="small">SLOT 0'+(i+1)+(s?' · '+STORY[s.node]?.title+' · '+date(s):' · 빈 슬롯')+'</div><button onclick="saveSlot('+i+')">여기에 저장</button>'+(s?'<button onclick="loadSlot('+i+')">불러오기</button>':'')+'</div>'});h+='<button onclick="exportSave()">저장 파일 내보내기</button><button onclick="document.getElementById(\'importFile\').click()">가져오기</button><input id="importFile" type="file" accept="application/json,.json" style="display:none" onchange="importSave(this)"><button onclick="closeOverlay()">닫기</button>';modal(h)}
function saveSlot(i){if(!state){toast('이야기를 시작한 다음 저장할 수 있어.');return}if(store.slots[i]){modal('<h2>이 저장을 덮어쓸까?</h2><p>슬롯 0'+(i+1)+'의 기존 진행이 현재 진행으로 바뀌어.</p><button onclick="writeSlot('+i+')">덮어쓰기</button><button onclick="openSaves()">취소</button>');return}writeSlot(i)}
function writeSlot(i){state.saved=Date.now();store.slots[i]=clone(state);let ok=persist();openSaves();toast(ok?'저장했어.':'임시 저장만 가능해. 저장 파일을 내보내 줘.')}
function loadSlot(i){if(store.slots[i])loadState(store.slots[i])}
function exportSave(){let blob=new Blob([JSON.stringify(store,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='afterrain_save.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importSave(input){try{let f=input.files[0];if(!f||f.size>2000000)throw Error();let d=JSON.parse(await f.text());if(!Array.isArray(d.slots)||d.slots.length!==3||!d.slots.every(s=>s===null||validState(s))||(d.auto&&!validState(d.auto))||!Array.isArray(d.unlocked)||!d.unlocked.every(k=>endInfo[k]))throw Error();store={slots:d.slots,auto:d.auto||null,unlocked:d.unlocked};persist();openSaves();toast('저장 파일을 가져왔어.')}catch(e){toast('읽을 수 없는 저장 파일이야. 기존 저장은 유지했어.')}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openLog(){let entries=state?state.log.slice(-100):[];modal('<h2>대화 기록</h2>'+(entries.length?entries.map(l=>'<div class="logline"><b>'+esc(l.who||'풍경')+'</b>'+esc(l.text)+'</div>').join(''):'<p>아직 지나간 대사가 없어.</p>')+'<button onclick="closeOverlay()">돌아가기</button>');$('panel').scrollTop=$('panel').scrollHeight}
function openGallery(){let h='<h2>엔딩 노트</h2><p>누군가를 설득하는 것과, 그 사람이 스스로 말하게 기다리는 것은 다를 수 있어. 관계와 방송은 함께 바뀌지만, 꼭 같은 결말에 도착하지는 않아.</p>';Object.entries(endInfo).forEach(([id,e])=>{let got=store.unlocked.includes(id);h+='<div class="logline"><b>ENDING '+e[0]+' '+(got?'UNLOCKED':'LOCKED')+'</b>'+(got?'<strong>'+e[1]+'</strong><br>'+e[2]:'아직 듣지 못한 이야기')+'</div>'});h+='<p class="small">공략 힌트: 가까워지는 데는 경계를 존중하는 태도가, 목소리를 되찾는 데는 자신의 말을 하도록 돕는 태도가 영향을 줘. 마지막에 네 마음을 선택할 수도 있어.</p><button onclick="closeOverlay()">닫기</button>';modal(h)}
function openMenu(){modal('<h2>잠깐 쉬어 가기</h2><p>조작: 화면 아래 대사창 / Space / Enter로 진행. 글자가 나오는 중 누르면 한 번에 표시돼. 선택지는 클릭·터치 또는 숫자키. Esc는 메뉴 닫기, A는 자동 진행이야.</p><p>텍스트 속도</p><button onclick="preferences.speed=45;toast(\'느리게\')">느리게</button><button onclick="preferences.speed=28;toast(\'보통\')">보통</button><button onclick="preferences.speed=0;toast(\'즉시 표시\')">즉시 표시</button><hr style="border:0;border-top:1px solid #ffffff20;margin:22px 0"><button onclick="closeOverlay();toggleAuto()">자동 진행 전환</button><button onclick="openGallery()">엔딩 노트</button><button onclick="goTitle()">타이틀로</button><button onclick="closeOverlay()">계속하기</button><p class="small">창작 단편 · 단일 루트 / 엔딩 3종<br>AI 생성 키 비주얼 1장 사용. 표정별 스탠딩·음성 연기는 포함하지 않았어. 음악과 빗소리는 기기에서 합성하며 외부 연결 없이 재생돼.</p>')}
function toggleSound(){try{if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=0;master.connect(audio.destination);let buf=audio.createBuffer(1,audio.sampleRate*3,audio.sampleRate),data=buf.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*.16;rainSource=audio.createBufferSource();rainSource.buffer=buf;rainSource.loop=true;let f=audio.createBiquadFilter();f.type='lowpass';f.frequency.value=1600;let rg=audio.createGain();rg.gain.value=.38;rainSource.connect(f);f.connect(rg);rg.connect(master);rainSource.start();musicTimer=setInterval(playNote,1100)}audio.resume();sound=!sound;master.gain.setTargetAtTime(sound?.35:0,audio.currentTime,.6);$('soundBtn').textContent='소리 '+(sound?'ON':'OFF');if(sound)playNote()}catch(e){toast('이 브라우저에서는 소리를 재생할 수 없어.')}}
function playNote(){if(!sound||!audio)return;const notes=[261.63,329.63,392,493.88,440,392,329.63,293.66,220,261.63,329.63,392,349.23,329.63,293.66,246.94];let t=audio.currentTime;[1,2].forEach((harm,i)=>{let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=notes[noteIndex%notes.length]*harm;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(i?.009:.035,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+3);o.connect(g);g.connect(master);o.start(t);o.stop(t+3.1)});noteIndex++}
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopAuto();if(audio)audio.suspend()}else if(audio&&sound)audio.resume()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('overlay').classList.contains('hidden'))closeOverlay();else openMenu();return}if(!$('overlay').classList.contains('hidden')){if(e.key==='Tab'){let f=[...$('panel').querySelectorAll('button,input:not([style*="display:none"])')].filter(x=>x.offsetParent!==null);if(!f.length)return;if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===f.at(-1)){e.preventDefault();f[0].focus()}}return}if(!state||!$('title').classList.contains('hidden'))return;if(['INPUT','TEXTAREA'].includes(e.target.tagName))return;if(!$('choices').classList.contains('hidden')&&/^[1-3]$/.test(e.key)){e.preventDefault();choose(Number(e.key)-1);return}if(e.key.toLowerCase()==='a'){toggleAuto();return}if((e.code==='Space'||e.key==='Enter')&&e.target.tagName!=='BUTTON'){e.preventDefault();advance()}});
</script></body></html>
